# Доступен только во внутренней сети Docker (в dev ещё на 127.0.0.1), поэтому без пароля.
bind 0.0.0.0
protected-mode no
port 6379

# Сессии переживают перезапуск.
appendonly yes
appendfsync everysec

# Без вытеснения: LRU тихо выкидывал бы сессии. maxmemory ниже mem_limit контейнера.
maxmemory-policy noeviction
maxmemory 192mb

loglevel notice
