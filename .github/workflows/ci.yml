name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reshis_avia_test
          POSTGRES_USER: reshis_avia
          POSTGRES_PASSWORD: reshis_avia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reshis_avia -d reshis_avia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://reshis_avia:reshis_avia_ci@localhost:5432/reshis_avia_test?schema=public
      REDIS_URL: redis://localhost:6379/1
      NEXT_PUBLIC_API_URL: http://localhost:3501/api/v1
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          # Токен не остаётся в .git/config, где его прочёл бы скрипт установки любого пакета.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Уязвимости в продовых зависимостях
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          jq -e '.vulnerabilities' "$RUNNER_TEMP/audit.json" > /dev/null ||
            { echo "npm audit не ответил"; cat "$RUNNER_TEMP/audit.json"; exit 1; }
          found="$(jq -r '[.vulnerabilities[].via[] | objects
            | select(.severity == "high" or .severity == "critical") | .url]
            | unique[]' "$RUNNER_TEMP/audit.json")"
          allowed="$(grep -o 'https://github.com/advisories/GHSA-[0-9a-z-]*' .github/audit-allowlist.md | sort -u)"
          new="$(comm -23 <(printf '%s\n' "$found" | sed '/^$/d' | sort -u) <(printf '%s\n' "$allowed"))"
          if [ -n "$new" ]; then
            echo "Новые предупреждения уровня high и выше:"
            echo "$new"
            exit 1
          fi

      - name: Общий контракт
        run: npm --prefix packages/shared run build

      - name: Клиент Prisma
        run: npm --prefix apps/backend run prisma:generate

      - name: 'Бэкенд: типы, линтер, сборка'
        run: |
          npm --prefix apps/backend run typecheck
          npm --prefix apps/backend run lint
          npm --prefix apps/backend run build

      - name: 'Бэкенд: тесты'
        run: npm --prefix apps/backend test

      # Схему тестовой базы накатывает test/global-setup.ts.
      - name: 'Бэкенд: сквозные тесты'
        run: npm --prefix apps/backend run test:e2e

      - name: 'Фронтенд: типы, линтер, сборка'
        run: |
          npm --prefix apps/frontend run typecheck
          npm --prefix apps/frontend run lint
          npm --prefix apps/frontend run build

  # Проверка прод-конфигурации и сборка образов
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOMAIN: ci.example.com
      ACME_EMAIL: ci@example.com
      POSTGRES_DB: reshis_avia
      POSTGRES_USER: reshis_avia
      POSTGRES_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Сети и порты
        run: |
          c="$RUNNER_TEMP/compose.json"
          docker compose -f docker-compose.prod.yml config --format json > "$c"
          check() { jq -e "$1" "$c" > /dev/null || { echo "Нарушено: $2"; exit 1; }; }
          check '[.services | to_entries[] | select((.value.ports // []) | length > 0) | .key] == ["caddy"]' \
            'порты на хост публикует только Caddy'
          check '.networks.data.internal == true and .networks.web.internal == true' \
            'сети data и web без выхода в интернет'
          check '(.services.postgres.networks | keys) == ["data"] and (.services.redis.networks | keys) == ["data"]' \
            'база и Redis только в сети data'
          check '(.services.frontend.networks | keys) == ["web"]' 'фронт видит только бэкенд'
          check '[.services[] | select(.mem_limit == null)] == []' 'у каждого сервиса есть mem_limit'

      - name: Caddyfile
        run: >-
          docker run --rm -e DOMAIN -e ACME_EMAIL
          -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Сборка образов
        run: docker compose -f docker-compose.prod.yml build
